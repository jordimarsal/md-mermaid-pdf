[project]
authors = [{name = "Jordi Marçal",email="marcaljordi@gmail.com"}]
name = "md-mermaid-pdf"
version = "0.2.0"
description = ""
requires-python = ">=3.11,<=3.14"
readme = "README.md"
dependencies = [
    "click>=8.3.1",
    "colorama>=0.4.6",
    "markdown2>=2.5.4",
    "markupsafe>=3.0.3",
    "md2pdf>=3.1.0",
    "mermaid-py>=0.8.3",
    "requests>=2.32.5",
    "tqdm>=4.67.3",
]
license = {text = "MIT"}
keywords = ["markdown", "mermaid", "pdf", "cli"]
classifiers = ['Programming Language :: Python :: 3', 'License :: OSI Approved :: MIT License', 'Operating System :: OS Independent']


[project.scripts]
md-mermaid-pdf = "src.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src", "src/core", "src/core/color"]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=9.0.2",
    "coverage>=7.13.4",
    # Type checking
    "mypy>=1.19.1",
    "types-click>=7.1.8",
    "types-colorama>=0.4.15.20250801",
    "types-markdown>=3.10.2.20260211",
    "types-requests>=2.32.4.20260107",
    "types-tqdm>=4.67.3.20260205",
    # Code quality
    "black>=26.1.0",
    "ruff>=0.15.1",
    # Development tools
    "ipython>=9.10.0",
    "icecream>=2.1.10",
]


[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
lint.select = ["F", "E", "W", "I", "N", "ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
exclude = [
    "build/",
    "dist/",
    "__pycache__",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
